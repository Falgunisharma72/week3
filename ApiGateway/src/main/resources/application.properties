spring.application.name=ApiGateway

server.port=8080



# USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].id=USER-SERVICE
#spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://UserService
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**


# PROJECT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].id=PROJECT-SERVICE
#spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ProjectService
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/projects/**


# ISSUE-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].id=ISSUE-SERVICE
#spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://IssueService
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/issues/**